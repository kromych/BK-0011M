[package]
name = "bk-desktop"
version = "0.1.0"
description = "Desktop front end for the BK-0011M emulator"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bk"
path = "src/main.rs"

[dependencies]
arboard = { version = "3", default-features = false }
bk = { path = "../bk" }
cpal = "0.18.2"
gilrs = "0.11.2"
minifb = "0.29.0"
png = "0.18.1"
rfd = "0.18.0"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
